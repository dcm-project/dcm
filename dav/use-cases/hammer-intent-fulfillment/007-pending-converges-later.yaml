scenario:
  description: >-
    An intent left a container blocked-transient on a PVC that had no capacity (the operational
    convergence case, w>0). Later, storage capacity frees. The reconciliation loop realizes the
    previously-pending PVC and then the container that operationally depended on it — with no new
    consumer request. The original intent was persistent desired state, not a one-shot command, so
    the held members converge on their own when the transient blocker clears. The consumer's
    surfaced state updates from blocked-transient to realized and the shortfall warning clears.
    This is the persistence proof under the nature model: a transient member (and the operational
    dependents it was holding) converges later, driven by reconciliation, traceable to the
    original intent.
