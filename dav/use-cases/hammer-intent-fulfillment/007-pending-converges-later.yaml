  intent: >-
    Have a persistent intent's blocked-transient member and its operational dependents converge to
    Realized later via reconciliation, with no re-request and the surfaced state updating
  success_criteria:
  - The blocked-transient PVC realizes when its transient blocker clears, driven by reconciliation, not a new request
  - The container that operationally depended on it converges once the PVC realizes — the held chain proceeds automatically
  - The original intent persisted as desired state across the gap (held, not discarded)
  - The consumer's surfaced shortfall clears when the members reach Realized
  - The convergence event is auditable back to the original intent — no duplicate or conflicting realization
