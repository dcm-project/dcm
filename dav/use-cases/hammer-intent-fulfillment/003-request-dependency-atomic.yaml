    resource_complexity: composite_service
    policy_complexity: multiple_interacting
    provider_landscape: multiple_eligible
    governance_context: standard_governance
    failure_mode: partial_fulfillment
  profile: standard
  expected_domain_interactions:
  - domain: data
    interaction: a request dependency binds the peers as one unit at the Requested layer; members held at Requested, atomic transition to Realized
  - domain: policy
    interaction: request nature yields hold-all activation (up) and cancel-all (down) from one binding — the two atomic faces
  - domain: provider
    interaction: reserve across all members (ADR-011) before any activates; no reservation becomes an activation until all can
  - domain: audit
    interaction: the request-coupling, the blocking member, and the atomic activation or whole-unit cancel are recorded
