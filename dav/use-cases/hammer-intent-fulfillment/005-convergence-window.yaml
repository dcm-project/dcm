    failure_mode: timeout
  profile: standard
  expected_domain_interactions:
  - domain: data
    interaction: the convergence window w is an intent field on the member; member status (transient|permanent) is separate
  - domain: policy
    interaction: w=0 fail-fast, w=N converge-then-give-up, w=infinity defer — the sole converge-vs-fail-fast dial, applied to transient members
  - domain: provider
    interaction: the reconciliation loop re-attempts the member until it converges or the window expires
  - domain: audit
    interaction: the window setting, the convergence or give-up, and any dependency-cancellation are recorded
